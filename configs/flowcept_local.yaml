# Laptop: FULLY OFFLINE. No Redis, no Mongo, no network.
#
# Provenance is written to disk as JSONL via project.dump_buffer -- Flowcept's
# built-in "full-offline" profile. db_flush_mode=offline REQUIRES every
# persistent DB off, LMDB included (configs.py raises if you enable one), so do
# not turn lmdb back on here.
#
# Same shape as configs/flowcept_polaris.yaml on purpose: the local arm should
# produce a buffer the same reader parses, so report.py is exercised here rather
# than first meeting real data on a compute node.
flowcept_version: 1.0.3

project:
  debug: false
  json_serializer: default
  replace_non_json_serializable: true
  performance_logging: false
  # Keep false. WorkflowObject.enrich() REPLACES conf with {"settings_path": ...}
  # instead of merging into it, which wipes the model/tokenizer the connector
  # records on its workflow -- and without the tokenizer, prompt_token_ids in the
  # captured tasks cannot be decoded back to text. That makes the whole capture
  # uninterpretable, so this stays off until the clobber is fixed upstream.
  enrich_messages: false
  db_flush_mode: offline
  dump_buffer:
    enabled: true
    path: flowcept_buffer.jsonl
    append_id_to_path: true
    append_workflow_id_to_path: true
    delete_previous_file: false

log:
  log_path: "default"
  log_file_level: info
  log_stream_level: error

telemetry_capture:
  gpu: ~          # no NVIDIA device on this machine
  cpu: true
  per_cpu: false
  process_info: true
  mem: true
  disk: false
  network: false
  machine_info: true

instrumentation:
  enabled: true

experiment:
  user: agueroudji

mq:
  enabled: false

kv_db:
  enabled: false

sys_metadata:
  environment_id: "laptop"

db_buffer:
  insertion_buffer_time_secs: 5
  buffer_size: 500
  remove_empty_fields: false
  stop_max_trials: 300
  stop_trials_sleep: 0.1

databases:
  lmdb:
    enabled: false
  mongodb:
    enabled: false

adapters: {}
